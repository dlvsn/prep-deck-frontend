# The built web client. Routing is hash-based (#/topics/…), so every page is index.html.
# add_header in a location replaces the server's, so each location repeats the common ones.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # index.html changes with every build: always ask for the current one.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Built assets carry a content hash in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
